name: 'AgentTest'
description: 'AI agent cost guardrails for CI/CD. Catches runaway executions and financial regressions before release.'
author: 'AgentTest'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  service-key:
    description: 'Repository-scoped AgentTest service key (store as a GitHub Actions secret)'
    required: false
  api-key:
    description: 'Deprecated alias for service-key; remove after migrating the workflow'
    required: false
  config-path:
    description: 'Path to agenttest.config.yml'
    required: false
    default: './agenttest.config.yml'
  trigger-mode:
    description: 'When to run: "always", "label" (requires agenttest-run label), or "ready" (Ready for Review only)'
    required: false
    default: 'always'
outputs:
  status:
    description: 'Evaluation result: pass, fail, calibration, or skipped'
  median-cost:
    description: 'Median cost in USD across Monte Carlo runs'
  z-score:
    description: 'Z-Score of the cost anomaly'

runs:
  using: 'node24'
  main: 'dist/index.js'
